<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#3b82f6">
  <title>Kantor</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
  <header>
    <h1>Kantor</h1>
    <div class="header-right">
      <div id="connection-status" class="connection-status">
        <span class="status-dot"></span>
        <span id="status-text"></span>
      </div>
      <div class="menu-wrapper">
        <button id="menu-btn" class="menu-btn" aria-label="Menu">
          <span class="menu-icon"></span>
        </button>
        <div id="menu-dropdown" class="menu-dropdown hidden">
          <div class="menu-header">Menu</div>
          <button id="menu-login" class="menu-item">Zaloguj</button>
          <button id="menu-register" class="menu-item">Zarejestruj</button>
          <button id="menu-home" class="menu-item hidden">Strona główna</button>
          <button id="menu-balance" class="menu-item hidden">Twoje środki</button>
          <button id="menu-history" class="menu-item hidden">Twoje wymiany</button>
          <button id="menu-notifications" class="menu-item hidden">Powiadomienia</button>
          <button id="menu-logout" class="menu-item hidden">Wyloguj</button>
        </div>
        <div id="menu-overlay" class="menu-overlay hidden"></div>
      </div>
    </div>
  </header>
  <div id="auth-modal" class="modal hidden">
    <div class="modal-content">
      <button class="close">&times;</button>
      <h2 id="modal-title">Zaloguj się</h2>
      <form id="auth-form">
        <div id="register-fields" class="hidden">
          <div class="form-group">
            <label for="first-name">Imię</label>
            <input type="text" id="first-name">
          </div>
          <div class="form-group">
            <label for="last-name">Nazwisko</label>
            <input type="text" id="last-name">
          </div>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required>
        </div>
        <div class="form-group">
          <label for="password">Hasło</label>
          <input type="password" id="password" required>
        </div>
        <button type="submit" id="submit-btn">Zaloguj się</button>
      </form>
      <p class="auth-switch" id="auth-switch">
        <span id="auth-switch-text"></span>
        <a href="#" id="auth-switch-link"></a>
      </p>
    </div>
  </div>
  <div id="app"></div>
  <script type="module" src="./src/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker zarejestrowany:', reg.scope))
          .catch(err => console.error('Błąd rejestracji Service Worker:', err));
      });
    }
  </script>
</body>
</html>
