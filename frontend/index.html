<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4A90E2" />
    <title>Kantor Internetowy</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <h1>Kantor</h1>
        <div class="header-right">
          <div class="status-bar">
            <span class="status-dot"></span>
            <span id="status">Łączenie...</span>
          </div>
          <div class="menu-wrapper">
            <button id="menu-btn" class="menu-btn" aria-label="Menu">
              <span class="menu-icon"></span>
            </button>
            <div id="menu-dropdown" class="menu-dropdown hidden">
              <div class="menu-header">Menu</div>
              <a href="#" id="menu-login" class="menu-item">Zaloguj</a>
              <a href="#" id="menu-register" class="menu-item">Zarejestruj</a>
              <a href="#home" id="menu-home" class="menu-item hidden">Strona główna</a>
              <a href="#balance" id="menu-balance" class="menu-item hidden">Twoje środki</a>
              <a href="#notifications" id="menu-notifications" class="menu-item hidden">Powiadomienia</a>
              <a href="#history" id="menu-history" class="menu-item hidden">Twoje wymiany</a>
              <a href="#" id="menu-logout" class="menu-item hidden">Wyloguj</a>
            </div>
            <div id="menu-overlay" class="menu-overlay hidden"></div>
          </div>
        </div>
      </header>
      <main>
        <section id="user-section" class="user-section hidden"></section>
        <section id="prices-section" class="prices-section">
          <h2>Aktualne kursy walut</h2>
          <div id="prices-warning" class="warning hidden">Dane nieaktualne</div>
          <div id="prices-list" class="prices-list">
            <div class="loader">
              <div class="spinner"></div>
              <span>Łączenie z bazą walutową...</span>
            </div>
          </div>
        </section>
      </main>
      <div id="modal" class="modal hidden">
        <div class="modal-content">
          <span class="modal-close">&times;</span>
          <div id="modal-body"></div>
        </div>
      </div>
    </div>
    <script src="./db.js"></script>
    <script src="./js/state.js"></script>
    <script src="./js/geolocation.js"></script>
    <script src="./js/install.js"></script>
    <script src="./js/onboarding.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/router.js"></script>
    <script src="./js/components/menu.js"></script>
    <script src="./js/components/modal.js"></script>
    <script src="./js/views/prices.js"></script>
    <script src="./js/views/home.js"></script>
    <script src="./js/views/balance.js"></script>
    <script src="./js/views/notifications.js"></script>
    <script src="./js/views/history.js"></script>
    <script src="./js/notifications.js"></script>
    <script src="./js/queue.js"></script>
    <script src="./app.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/sw.js')
            .then((reg) => {
              console.log('Service Worker zarejestrowany z zakresem:', reg.scope);
            })
            .catch((err) => {
              console.log('Rejestracja Service Workera nie powiodła się:', err);
            });
        });
      }
    </script>
  </body>
</html>
