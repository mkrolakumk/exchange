name: Build APK

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: 'Backend API URL'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Inject API URL
        working-directory: frontend/src/utils
        run: sed -i "s|__API_URL__|${{ github.event.inputs.backend_url }}|g" api.js
      
      - name: Setup Capacitor
        working-directory: frontend
        run: |
          npm install -g @capacitor/cli @capacitor/core @capacitor/android
          npm init -y
          npx cap init "Kantor" "pl.kantor.app" --web-dir .
          npx cap add android
      
      - name: Configure Android project
        working-directory: frontend/android
        run: |
          backend_host=$(echo "${{ github.event.inputs.backend_url }}" | sed -e 's|^https\?://||' -e 's|/.*$||')
          echo "https://$backend_host" > app/src/main/assets/capacitor.config.json
      
      - name: Build APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kantor-apk
          path: frontend/android/app/build/outputs/apk/release/*.apk