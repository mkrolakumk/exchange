name: Build APK

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: 'Backend API URL'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - uses: android-actions/setup-android@v3
      
      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli
      
      - name: Inject API URL
        working-directory: frontend/src/utils
        run: sed -i "s|__API_URL__|${{ github.event.inputs.backend_url }}|g" api.js
      
      - name: Init TWA
        working-directory: frontend
        run: |
          mkdir -p twa-build && cd twa-build
          echo "y" | bubblewrap init --manifest ../manifest.json --skipPwaValidation
      
      - name: Generate keystore
        run: |
          keytool -genkey -v -keystore keystore.jks \
            -alias kantor-key -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Kantor, OU=Mobile, O=Kantor, L=Warsaw, ST=Mazovia, C=PL"
      
      - name: Update manifest
        working-directory: frontend/twa-build
        run: |
          jq '.host = "${{ github.event.inputs.backend_url }}" | .signingKey.path = "../../keystore.jks" | .signingKey.alias = "kantor-key"' twa-manifest.json > tmp.json
          mv tmp.json twa-manifest.json
      
      - name: Build APK
        working-directory: frontend/twa-build
        env:
          KEYSTORE_PASSWORD: android
          KEY_PASSWORD: android
        run: bubblewrap build --skipPwaValidation
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kantor-apk
          path: frontend/twa-build/**/*-signed.apk
