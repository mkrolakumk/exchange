name: Build APK

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: 'Backend API URL'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Inject API URL
        working-directory: frontend/src/utils
        run: sed -i "s|__API_URL__|${{ github.event.inputs.backend_url }}|g" api.js
      
      - name: Install PWABuilder CLI
        run: npm install -g @pwabuilder/cli
      
      - name: Verify PWABuilder
        run: |
          which pwabuilder || echo "pwabuilder not in PATH"
          ls -la $(npm root -g)/@pwabuilder/
          npm list -g @pwabuilder/cli
      
      - name: Prepare manifest
        working-directory: frontend
        run: |
          backend_host=$(echo "${{ github.event.inputs.backend_url }}" | sed -e 's|^https\?://||' -e 's|/.*$||')
          jq --arg url "https://$backend_host/" '.start_url = $url' manifest.json > manifest-pwa.json
      
      - name: Build APK with PWABuilder
        working-directory: frontend
        run: |
          npx @pwabuilder/cli package \
            --platform android \
            --manifest manifest-pwa.json \
            --output ./apk-output
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kantor-apk
          path: frontend/apk-output/**/*.apk