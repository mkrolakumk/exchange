name: Build APK

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: 'Backend API URL'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli
      
      - name: Inject API URL
        working-directory: frontend/src/utils
        run: sed -i "s|__API_URL__|${{ github.event.inputs.backend_url }}|g" api.js
      
      - name: Init TWA
        working-directory: frontend
        run: |
          mkdir -p twa-build && cd twa-build
          printf "y\ny\n" | bubblewrap init --manifest ../manifest.json --skipPwaValidation
      
      - name: Generate keystore
        run: |
          keytool -genkey -v -keystore keystore.jks \
            -alias kantor-key -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Kantor, OU=Mobile, O=Kantor, L=Warsaw, ST=Mazovia, C=PL"
      
      - name: Update manifest
        working-directory: frontend/twa-build
        run: |
          # Zakładam, że backend_url to pełny URL, np. https://api.example.com
          # Ale .host w twa-manifest.json powinien być domeną bez https:// i ścieżki
          # Jeśli backend_url to URL API, a nie host PWA, to to może być błędem – dostosuj jeśli potrzeba
          # np. jq '.host = "example.com"' jeśli host jest stały
          # Albo wyciągnij host z URL: ale na razie zostawiam jak jest, ale dodaję usunięcie https://
          backend_host=$(echo "${{ github.event.inputs.backend_url }}" | sed -e 's|^https://||' -e 's|/.*$||')
          jq --arg host "$backend_host" '.host = $host | .signingKey.path = "../../keystore.jks" | .signingKey.alias = "kantor-key"' twa-manifest.json > tmp.json
          mv tmp.json twa-manifest.json
      
      - name: Build APK
        working-directory: frontend/twa-build
        env:
          KEYSTORE_PASSWORD: android
          KEY_PASSWORD: android
        run: |
          # Bubblewrap build promptuje za passwordami, więc pipe'ujemy je
          printf "${KEYSTORE_PASSWORD}\n${KEY_PASSWORD}\n" | bubblewrap build --skipPwaValidation
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kantor-apk
          path: frontend/twa-build/**/*-signed.apk