name: Build APK

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: 'Backend API URL'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - uses: android-actions/setup-android@v3
      
      - name: Install expect
        run: sudo apt-get update && sudo apt-get install -y expect
      
      - name: Verify env
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la $JAVA_HOME
          ls -la $ANDROID_SDK_ROOT
      
      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli
      
      - name: Inject API URL
        working-directory: frontend/src/utils
        run: sed -i "s|__API_URL__|${{ github.event.inputs.backend_url }}|g" api.js
      
      - name: Init TWA
        working-directory: frontend
        env:
          MY_JAVA_HOME: ${{ env.JAVA_HOME }}
          MY_ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          mkdir -p twa-build && cd twa-build
          expect -c '
            set env(MY_JAVA_HOME) $env(MY_JAVA_HOME)
            set env(MY_ANDROID_SDK_ROOT) $env(MY_ANDROID_SDK_ROOT)
            spawn bubblewrap init --manifest ../manifest.json --skipPwaValidation
            expect "install the JDK"
            send "n\r"
            expect "Path to your existing JDK 17:"
            send "$env(MY_JAVA_HOME)\r"
            expect "install the Android SDK"
            send "n\r"
            expect "Path to your existing Android SDK:"
            send "$env(MY_ANDROID_SDK_ROOT)\r"
            expect eof
          '
          ls -la
          cat twa-manifest.json
      
      - name: Generate keystore
        run: |
          keytool -genkey -v -keystore keystore.jks \
            -alias kantor-key -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Kantor, OU=Mobile, O=Kantor, L=Warsaw, ST=Mazovia, C=PL"
      
      - name: Update manifest
        working-directory: frontend/twa-build
        run: |
          backend_host=$(echo "${{ github.event.inputs.backend_url }}" | sed -e 's|^https://||' -e 's|/.*$||')
          jq --arg host "$backend_host" '.host = $host | .signingKey.path = "../../keystore.jks" | .signingKey.alias = "kantor-key"' twa-manifest.json > tmp.json
          mv tmp.json twa-manifest.json
      
      - name: Build APK
        working-directory: frontend/twa-build
        env:
          KEYSTORE_PASSWORD: android
          KEY_PASSWORD: android
        run: |
          expect -c '
            spawn bubblewrap build --skipPwaValidation
            expect "Enter keystore password:"
            send "$env(KEYSTORE_PASSWORD)\r"
            expect "Enter key password for kantor-key:"
            send "$env(KEY_PASSWORD)\r"
            expect eof
          '
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kantor-apk
          path: frontend/twa-build/**/*-signed.apk