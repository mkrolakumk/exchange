name: Build APK

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: 'Backend API URL'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Inject API URL
        working-directory: frontend/src/utils
        run: sed -i "s|__API_URL__|${{ github.event.inputs.backend_url }}|g" api.js
      
      - name: Use PWABuilder Cloud API
        working-directory: frontend
        run: |
          backend_host=$(echo "${{ github.event.inputs.backend_url }}" | sed -e 's|^https\?://||' -e 's|/.*$||')
          
          jq --arg url "https://$backend_host/" \
             --arg icon192 "https://$backend_host/assets/icons/icon-192.png" \
             --arg icon512 "https://$backend_host/assets/icons/icon-512.png" \
             '.start_url = $url | .icons[0].src = $icon192 | .icons[1].src = $icon512' \
             manifest.json > manifest-build.json
          
          curl -X POST https://pwabuilder-apk-web.azurewebsites.net/generateApkZip \
            -H "Content-Type: application/json" \
            -d "{
              \"name\": \"Kantor Internetowy\",
              \"packageId\": \"pl.kantor.app\",
              \"host\": \"$backend_host\",
              \"startUrl\": \"/\",
              \"themeColor\": \"#3b82f6\",
              \"backgroundColor\": \"#0a0e27\",
              \"iconUrl\": \"https://$backend_host/assets/icons/icon-512.png\",
              \"maskableIconUrl\": \"https://$backend_host/assets/icons/icon-512.png\",
              \"signing\": {
                \"file\": null,
                \"alias\": \"my-key-alias\"
              }
            }" \
            -o apk.zip
          
          unzip apk.zip -d apk-output
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kantor-apk
          path: frontend/apk-output/**/*.apk