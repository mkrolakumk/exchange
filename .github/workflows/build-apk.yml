name: Build APK

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: 'Backend API URL'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java (21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Inject API URL
        working-directory: ./frontend/src/utils
        run: sed -i "s|__API_URL__|${{ inputs.backend_url }}|g" api.js

      - name: Prepare web assets (copy to www folder)
        working-directory: ./frontend
        run: |
          mkdir www
          cp -r assets src index.html manifest.webmanifest sw.js www/

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Setup Capacitor
        working-directory: ./frontend
        run: |
          npm init -y
          npm install @capacitor/cli @capacitor/core @capacitor/android @capacitor/local-notifications @capacitor/geolocation
          npx cap init "Kantor" "pl.kantor.app" --web-dir www

      - name: Configure server URL (optional)
        working-directory: ./frontend
        run: |
          jq '.server = { "url": "${{ inputs.backend_url }}", "allowNavigation": [] }' capacitor.config.json > temp.json && mv temp.json capacitor.config.json

      - name: Add Android platform
        working-directory: ./frontend
        run: npx cap add android

      - name: Sync Capacitor (plugins + assets)
        working-directory: ./frontend
        run: npx cap sync android

      - name: Build Debug APK (signed automatically with debug key)
        working-directory: ./frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug  # <--- TU ZMIANA: assembleDebug zamiast assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kantor-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk